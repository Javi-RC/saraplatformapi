name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

env:
  NODE_VERSION: '18.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter (if configured)
        run: npm run lint || echo "No linter configured, skipping..."
        continue-on-error: true
      
      - name: Run all tests
        run: npm test
        env:
          NODE_ENV: test
      
      - name: Generate coverage report
        run: npm run test:coverage
        env:
          NODE_ENV: test
      
      - name: Check coverage thresholds
        run: |
          echo "Verifying minimum coverage requirements..."
          # Aquí puedes añadir validaciones de cobertura mínima
          # Por ejemplo, usando istanbul o jest --coverage con umbrales
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-prod
          path: coverage/
          retention-days: 90

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for outdated dependencies
        run: npm outdated || true
      
      # Opcional: Escaneo adicional de seguridad
      # - name: Run Snyk security scan
      #   uses: snyk/actions/node@master
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install production dependencies
        run: npm ci --production
      
      - name: Verify build artifacts
        run: |
          echo "Checking production build..."
          ls -la src/
          test -f src/server.js || exit 1
          test -f src/app.js || exit 1
          test -f package.json || exit 1
          echo "✅ Build verification successful"
      
      - name: Create deployment package
        run: |
          tar -czf deployment.tar.gz \
            src/ \
            node_modules/ \
            package.json \
            package-lock.json
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security-scan, build]
    environment: 
      name: production
      url: ${{ vars.PROD_URL }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
      
      - name: Pre-deployment checks
        run: |
          echo "🔍 Pre-deployment verification..."
          echo "Branch: main"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      
      # Aquí añadirías tu estrategia de deployment específica para producción
      
      # Para Azure App Service:
      # - name: Deploy to Azure Production
      #   uses: azure/webapps-deploy@v2
      #   with:
      #     app-name: ${{ secrets.AZURE_APP_NAME_PROD }}
      #     publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}
