      #   if: always()

  rollback:
    name: Rollback Procedure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production
    
    steps:
      - name: Rollback notification
        run: |
          echo "⚠️ Deployment failed. Rollback procedure may be required."
          echo "Please check logs and consider reverting to previous version."
      
      # Aquí puedes añadir pasos automáticos de rollback si tu plataforma lo soporta
